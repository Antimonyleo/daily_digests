name: Local checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync ruff check --select F,B src tests
      - name: Unit tests and packaged asset paths
        run: uv run --no-sync pytest -rs

  browser-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install browser test dependencies
        working-directory: prototypes/browser-compute
        run: npm ci --ignore-scripts
      - name: Browser bridge and compute unit checks
        run: |
          node --test --test-isolation=none browser/*.test.mjs
          node --test --test-isolation=none prototypes/browser-compute/browser.test.mjs

      - name: Reject vulnerable Node dependencies
        working-directory: prototypes/browser-compute
        run: npm audit --package-lock-only --audit-level=moderate

  native-launchers:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - name: Native launcher fixtures and asset paths
        run: uv run --no-sync pytest tests/test_windows_launcher.py tests/test_start_script.py tests/test_package_assets.py tests/test_cli_process_tree.py tests/test_companion_cli.py tests/test_scheduler_ownership.py tests/test_settings_transaction.py tests/test_settings_config_recovery.py tests/test_summary_cancellation.py tests/test_companion_cancellation.py -rs
