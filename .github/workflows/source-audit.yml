name: DailyDigest browser source access

# A real Chrome probes every configured source from the Pages origin. Sources
# the browser fetches directly must stay readable (CORS and transport). Sources
# the daily public snapshot carries must have a usable published record, or
# else a direct read that works. A change such as an upstream API refusing CORS
# preflight, or a feed the collector can no longer read, opens one issue, and
# the issue closes after a clean audit.
on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dailydigest-source-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/browser-compute/package-lock.json
      - run: uv sync --frozen --no-dev
      - name: Install browser dependencies
        working-directory: prototypes/browser-compute
        run: npm ci --ignore-scripts
      - name: Audit direct browser sources, retrying a failure once
        id: audit
        run: |
          mkdir -p .source-audit
          origin=https://antimonyleo.github.io/daily_digests/
          audit() {
            # A missing snapshot is judged as unavailable, not skipped.
            curl --fail --location --silent --show-error --max-time 60 \
              --output .source-audit/public-sources.json "${origin}assets/public-sources.json" \
              || rm -f .source-audit/public-sources.json
            node browser/source-audit.mjs "$origin" .source-audit/report.json
            uv run --no-sync python browser/check_source_access.py .source-audit/report.json \
              --snapshot .source-audit/public-sources.json --summary .source-audit/summary.md
          }
          if ! audit; then
            sleep 60
            audit || echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          cat .source-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'summary<<DAILYDIGEST_SUMMARY'
            cat .source-audit/summary.md
            echo 'DAILYDIGEST_SUMMARY'
          } >> "$GITHUB_OUTPUT"
      # Also runs when the audit itself crashed (Chrome or the origin
      # unavailable), so a broken audit raises the issue instead of going quiet.
      - name: Maintain source access issue
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' }}
        env:
          DAILYDIGEST_ALERT_MODE: source-access-issue
          DAILYDIGEST_REFRESH_RESULT: ${{ (steps.audit.outcome == 'failure' || steps.audit.outputs.failed == 'true') && 'failure' || 'success' }}
          DAILYDIGEST_ACCESS_SUMMARY: ${{ steps.audit.outcome == 'failure' && '- The audit did not finish; see the run log.' || steps.audit.outputs.summary }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python browser/report_failure.py
      - name: Fail when direct sources stay unreadable
        if: ${{ steps.audit.outputs.failed == 'true' }}
        run: exit 1
