# DailyDigest prune workflow — manual trigger only (local-first mode)
#
# Automated pruning is not needed when running locally; data/digest.db lives
# on your machine and you can prune manually with `dd prune`.
# Re-enable the schedule below if you switch to a hosted/CI-based deployment.

name: Prune
on:
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Download digest-db artifact
        uses: actions/download-artifact@v4
        with:
          name: digest-db
          path: data/
        continue-on-error: true

      - name: Install dependencies
        run: uv sync

      - name: Prune old items
        run: uv run dd prune

      - name: Upload digest-db artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-db
          path: data/digest.db
          retention-days: 30
