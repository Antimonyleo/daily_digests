# DailyDigest inbound reply ingestion (Phase 7a) — disabled
#
# IMAP-based vote ingestion is not in use (local web UI voting is used instead).
# Schedule removed. Re-enable by adding a cron trigger and configuring IMAP secrets.

name: Ingest Replies
on:
  workflow_dispatch:

concurrency:
  group: ingest-replies
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Download digest-db artifact
        uses: actions/download-artifact@v4
        with:
          name: digest-db
          path: data/
        continue-on-error: true

      - name: Install dependencies
        run: uv sync

      - name: Ingest replies
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: '993'
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_MAILBOX: 'INBOX'
          REPLY_TO_EMAIL: ${{ secrets.REPLY_TO_EMAIL }}
        run: uv run dd ingest-replies

      - name: Upload digest-db artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-db
          path: data/digest.db
          retention-days: 30
