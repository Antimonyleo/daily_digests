# DailyDigest digest workflow — manual trigger only (local-first mode)
#
# Email delivery is not in use. This workflow is kept for CI reference;
# run it manually via workflow_dispatch if you want a dry-run on a GH runner.
# Schedule is intentionally disabled — run locally with `dd start`.

name: Digest
on:
  workflow_dispatch:

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Download digest-db artifact
        uses: actions/download-artifact@v4
        with:
          name: digest-db
          path: data/
        continue-on-error: true

      - name: Cache HuggingFace models (embeddings + reranker)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Bump the suffix when changing embed_model / rerank_model.
          key: hf-bge-small-msmarco-minilm-v1

      - name: Install dependencies
        run: uv sync

      - name: Run digest pipeline (dry-run)
        env:
          LLM_BACKEND: extractive
          PROFILE_PATH: config/profile.yaml
          # Per-journal quality prior (venue impact). The cross-encoder rerank is
          # DISABLED — the light ms-marco model degraded relevance on real data
          # (see .env). Enrichment degrades to a no-op if OpenAlex is unavailable.
          RERANK_ENABLED: 'false'
          CITATION_ENRICHMENT: 'true'
        run: uv run dd run-all --dry-run

      - name: Upload digest-db artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-db
          path: data/digest.db
          retention-days: 30
