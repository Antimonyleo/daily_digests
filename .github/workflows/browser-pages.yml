name: DailyDigest browser Pages

on:
  push:
    branches: [main, codex/browser-compute-prototype]
    paths: [browser/**, src/**, templates/**, tests/**, pyproject.toml, .github/workflows/ci.yml, config/sources.yaml, prototypes/browser-compute/**, .github/workflows/browser-pages.yml, uv.lock]
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'

permissions:
  contents: read

concurrency:
  group: dailydigest-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The event commit is authoritative; scheduled/manual runs use their selected branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Require browser sources at the event commit
        run: test -f browser/build.py
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/browser-compute/package-lock.json
      - run: uv sync --frozen --group dev
      - name: Python regression checks
        run: uv run pytest -q
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          LLM_API_KEY: ""
      - name: Browser bridge checks
        run: |
          node --test --test-isolation=none browser/*.test.mjs
          node --test --test-isolation=none prototypes/browser-compute/browser.test.mjs
      - name: Install browser dependencies
        working-directory: prototypes/browser-compute
        run: npm ci --ignore-scripts
      - name: Prepare public model and runtime assets
        working-directory: prototypes/browser-compute
        run: npm run prepare-fixture
      - name: Read previous public snapshot for bounded carryforward
        run: |
          mkdir -p browser/.build-cache
          curl --fail --location --max-time 30 --output browser/.build-cache/previous-public-sources.json https://antimonyleo.github.io/daily_digests/assets/public-sources.json || rm -f browser/.build-cache/previous-public-sources.json
      - name: Collect and validate public source metadata
        run: uv run python browser/collect_sources.py --output browser/.build-cache/public-sources.json --previous browser/.build-cache/previous-public-sources.json --event "${{ github.event_name }}" --days 21
      - name: Restore compatible public comparison cache
        run: uv run python browser/fetch_public_embeddings.py
      - name: Build static application
        run: uv run python browser/build.py
      - name: Deferred startup and optional publisher figures
        env:
          DAILYDIGEST_STARTUP_SITE: browser/dist
          DAILYDIGEST_STARTUP_REPORT: .full-review/startup-figures-ci
        run: node browser/verify-startup-figures.mjs
      - name: Large-checkpoint startup and recovery regression
        env:
          DAILYDIGEST_STORAGE_SITE: browser/dist
          DAILYDIGEST_STORAGE_REPORT: .full-review/storage-startup-ci
        run: node browser/verify-storage-startup.mjs
      - name: Prepare isolated browser acceptance fixtures
        run: uv run python browser/make_test_fixture.py --output .full-review/browser-launch-2026-10-13
      - name: Quick guide and optional local backup copies
        env:
          DAILYDIGEST_GUIDE_SITE: browser/dist
          DAILYDIGEST_GUIDE_REPORT: .full-review/guide-backup-ci
        run: node browser/verify-guide-backup.mjs
      - name: Instant saved reading view and on-demand controls
        env:
          DAILYDIGEST_READING_SITE: browser/dist
          DAILYDIGEST_READING_REPORT: .full-review/reading-view-ci
        run: node browser/verify-reading-view.mjs
      - name: Two-tab handoff without lost feedback
        env:
          DAILYDIGEST_TAB_SITE: browser/dist
          DAILYDIGEST_TAB_REPORT: .full-review/tab-handoff-ci
        run: node browser/verify-tab-handoff.mjs
      - name: Full browser acceptance at the project subpath
        env:
          DAILYDIGEST_BROWSER_URL: http://127.0.0.1:8767/daily_digests/
        run: |
          mkdir -p browser/.build-cache/preview
          ln -s "$GITHUB_WORKSPACE/browser/dist" browser/.build-cache/preview/daily_digests
          .venv/bin/python -m http.server 8767 --bind 127.0.0.1 --directory browser/.build-cache/preview > browser/.build-cache/preview-server.log 2>&1 &
          task_preview_pid=$!
          trap 'kill "$task_preview_pid" 2>/dev/null || true' EXIT
          node browser/verify-browser.mjs
          node browser/verify-semantic.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: browser/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  notify-failure:
    needs: [build, deploy]
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Report failed publication or source refresh
        continue-on-error: true
        env:
          DAILYDIGEST_ALERT_WEBHOOK: ${{ secrets.DAILYDIGEST_ALERT_WEBHOOK }}
        run: python browser/report_failure.py
  refresh-status:
    needs: [build, deploy]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.deploy.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Maintain recurring source refresh issue
        env:
          DAILYDIGEST_ALERT_MODE: github-issue
          DAILYDIGEST_REFRESH_RESULT: ${{ needs.build.result == 'success' && needs.deploy.result == 'success' && 'success' || 'failure' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python browser/report_failure.py
