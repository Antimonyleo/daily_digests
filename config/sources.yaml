regulatory:
  - name: FDA Press Announcements
    kind: rss
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml
  - name: FDA Drug Approvals (CDER)
    kind: rss
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/drugs/rss.xml
  # openFDA: default 2-day date-range query 500s intermittently. Constrain to approved
  # submissions only via `query` (consumed by FDASource as the raw `search` clause).
  - name: openFDA Drug Approvals
    kind: fda_api
    endpoint: drug/drugsfda.json
    query: submissions.submission_status:AP
  - name: ClinicalTrials.gov (recent updates)
    kind: clinicaltrials
  # EMA: all known RSS endpoints (rss.xml, en/rss.xml, en/news/rss.xml,
  # en/news-events/news/rss) currently return 404 or 429 (anti-bot). No working
  # public RSS at the time of writing. Re-enable once EMA publishes a stable URL.
  # TODO: monitor https://www.ema.europa.eu/en/news-events/news for an RSS link.
  # - name: EMA News
  #   kind: rss
  #   url: https://www.ema.europa.eu/en/news-events/news/rss

