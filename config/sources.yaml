    kind: rss
    url: https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/drugs/rss.xml
  # openFDA: default 2-day date-range query 500s intermittently. Constrain to approved
  # submissions only via `query` (consumed by FDASource as the raw `search` clause).
  - name: openFDA Drug Approvals
    kind: fda_api
    endpoint: drug/drugsfda.json
    query: submissions.submission_status:AP
  - name: ClinicalTrials.gov (recent updates)
    kind: clinicaltrials
