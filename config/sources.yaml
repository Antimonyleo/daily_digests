    kind: rss
    url: https://www.nature.com/nmeth.rss
    quality_tier: high
    prestige_score: 0.95
    impact_floor: 7.0
  - name: Nature Medicine
    kind: rss
    url: https://www.nature.com/nm.rss
    quality_tier: high
    prestige_score: 0.95
    impact_floor: 7.0
  - name: Science
    kind: rss
    url: https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science
    quality_tier: top
    prestige_score: 1.0
    impact_floor: 7.0
  - name: Cell
    kind: rss
    url: https://www.cell.com/cell/current.rss
    quality_tier: top
    prestige_score: 1.0
    impact_floor: 7.0
