# Source feeds grouped by section. Sections drive the email template grouping.
# `kind` selects the ingest adapter. Supported kinds:
#   rss, biorxiv, arxiv, openalex, pubmed, fda_api, clinicaltrials,
#   grants_gov, events_rss.
# Optional ranking metadata:
#   quality_tier, prestige_score, impact_floor, promo_risk.
# These are coarse local ranking hints, not live impact-factor lookups.
# EMA does not have a stable JSON API, so it is wired in as a plain `rss` entry
# below rather than as its own adapter class.

research:
  - name: Nature
    kind: rss
    url: https://www.nature.com/nature.rss
    quality_tier: top
    prestige_score: 1.0
    impact_floor: 7.0
  - name: Nature Biotechnology
    kind: rss
    url: https://www.nature.com/nbt.rss
    quality_tier: high
    prestige_score: 0.95
    impact_floor: 7.0
  - name: Nature Methods
    kind: rss
    url: https://www.nature.com/nmeth.rss
    quality_tier: high
    prestige_score: 0.95
    impact_floor: 7.0
  - name: Nature Medicine
    kind: rss
    url: https://www.nature.com/nm.rss
    quality_tier: high
    prestige_score: 0.95
    impact_floor: 7.0
  - name: Science
    kind: rss
    url: https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=science
    quality_tier: top
    prestige_score: 1.0
    impact_floor: 7.0
  - name: Cell
    kind: rss
    url: https://www.cell.com/cell/current.rss
    quality_tier: top
    prestige_score: 1.0
    impact_floor: 7.0
  - name: NEJM
    kind: rss
    url: https://www.nejm.org/action/showFeed?type=etoc&feed=rss&jc=nejm
    quality_tier: top
    prestige_score: 1.0
    impact_floor: 7.0
  - name: The Lancet
    kind: rss
    url: https://www.thelancet.com/rssfeed/lancet_current.xml
    quality_tier: top
    prestige_score: 1.0
    impact_floor: 7.0
  - name: PNAS
    kind: rss
    url: https://www.pnas.org/action/showFeed?type=etoc&feed=rss&jc=pnas
    quality_tier: high
    prestige_score: 0.9
    impact_floor: 7.0
  # eLife has swapped which feed works. Earlier `recent.xml` returned 406 and
  # `ahead.xml` worked; on 2026-10-28 `ahead.xml` returned 406 to the reader's
  # browser User-Agent and held only 2 stale items, while `recent.xml`
  # returned 200 with 100 current articles. The snapshot collection lists a
  # failing feed in its report.
  - name: eLife
    kind: rss
    url: https://elifesciences.org/rss/recent.xml
    quality_tier: strong
    prestige_score: 0.74
  - name: bioRxiv (recent)
    kind: biorxiv
    server: biorxiv
  - name: medRxiv (recent)
    kind: biorxiv
    server: medrxiv
  - name: arXiv q-bio.QM
    kind: arxiv
    category: q-bio.QM
  - name: arXiv cs.LG
    kind: arxiv
    category: cs.LG
  # q-bio.BM is where computational/AI biomolecular design is posted (protein and
  # nucleic-acid design models). cond-mat.soft is the home of colloidal
  # self-assembly and soft matter. Both are core interests that keyword-driven
  # OpenAlex was reaching only incidentally.
  - name: arXiv q-bio.BM
    kind: arxiv
    category: q-bio.BM
  - name: arXiv cond-mat.soft
    kind: arxiv
    category: cond-mat.soft
  # Note: remaining materials / optics preprints are covered via profile-driven
  # OpenAlex below (which indexes arXiv by keyword); arXiv rate-limits rapid
  # sequential requests, so direct category feeds are kept to the core few.
  # Profile-driven OpenAlex: actively searches ALL venues (incl. ChemRxiv, and
  # journals not in the RSS list) for the user's own keywords — the main recall
  # lever. Falls back to `query` only if the profile has no keywords.
  - name: OpenAlex (your topics)
    kind: openalex
    profile_driven: true
    # Topic retrieval also covers preprints outside the direct arXiv categories.
    openalex_types: article|preprint
    quality_tier: aggregator
    prestige_score: 0.34
    query: biotechnology OR therapeutic OR drug discovery
    polite_email: noreply@example.com
  # Recent works BY the profile's watched authors/labs, from any venue.
  - name: OpenAlex (your authors)
    kind: openalex_authors
    quality_tier: aggregator
    prestige_score: 0.34
    polite_email: noreply@example.com
  - name: PubMed (your topics)
    kind: pubmed
    profile_driven: true
    # Profile keywords are OR'd over title/abstract. This query is used ONLY
    # when the profile has no search terms; it is never OR'd into topical search.
    query: clinical trial[pt]
  # ACS native RSS endpoints return publisher-side 403 responses in common
  # server environments. Pull ACS journals through OpenAlex by venue id instead.
  # Two disjoint groups keep short catch-up windows below the adapter's per-source
  # cap. Items retain their real journal names and are still topic-gated later.
  # OpenAlex may index a paper after the ACS site; the profile-driven OpenAlex and
  # PubMed searches above provide additional retrieval paths.
  - name: ACS flagships (via OpenAlex)
    kind: openalex_venues
    polite_email: noreply@example.com
    venue_ids:
      - S145476921   # ACS Nano
      - S143846845   # Nano Letters
      - S111155417   # Journal of the American Chemical Society (JACS)
      - S66104727    # Chemistry of Materials
      - S2765035057  # ACS Central Science
      - S4210207119  # JACS Au
      - S164001016   # ACS Applied Materials & Interfaces
  - name: ACS field flagships (via OpenAlex)
    kind: openalex_venues
    polite_email: noreply@example.com
    venue_ids:
      - S37391459    # ACS Catalysis
      - S118914585   # ACS Chemical Biology
      - S177196338   # Macromolecules
      - S167262187   # Journal of Chemical Information and Modeling
  # ChemRxiv is a primary preprint venue for DNA/RNA nanotechnology and
  # supramolecular chemistry and had no channel at all. Routed through the
  # existing OpenAlex venue reader rather than a new adapter.
  - name: ChemRxiv (via OpenAlex)
    kind: openalex_venues
    quality_tier: repository
    prestige_score: 0.56
    polite_email: noreply@example.com
    # OpenAlex records ChemRxiv output as type:preprint, not type:article.
    openalex_types: preprint
    venue_ids:
      - S4393918830  # ChemRxiv

