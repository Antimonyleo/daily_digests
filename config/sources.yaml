    prestige_score: 1.0
    impact_floor: 7.0
  - name: The Lancet
    kind: rss
    url: https://www.thelancet.com/rssfeed/lancet_current.xml
    quality_tier: top
    prestige_score: 1.0
    impact_floor: 7.0
  - name: PNAS
    kind: rss
    url: https://www.pnas.org/action/showFeed?type=etoc&feed=rss&jc=pnas
    quality_tier: high
    prestige_score: 0.9
    impact_floor: 7.0
  - name: eLife
    kind: rss
    url: https://elifesciences.org/rss/recent.xml
    quality_tier: strong
    prestige_score: 0.74
  - name: bioRxiv (recent)
    kind: biorxiv
    server: biorxiv
  - name: medRxiv (recent)
    kind: biorxiv
    server: medrxiv
  - name: arXiv q-bio.QM
    kind: arxiv
    category: q-bio.QM
  - name: arXiv cs.LG
    kind: arxiv
    category: cs.LG
  - name: OpenAlex (biotech)
    kind: openalex
    quality_tier: aggregator
    prestige_score: 0.34
    query: biotechnology OR therapeutic OR clinical trial OR drug discovery
    polite_email: noreply@example.com
  - name: PubMed (clinical/biotech)
    kind: pubmed
    # Simplified: the prior topic AND-clause filtered everything out (0 hits in 2-day window).
    # This broader query reliably returns 20+ items in the 2-day reldate window.
    query: clinical trial[pt]

