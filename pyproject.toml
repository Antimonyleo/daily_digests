[project]
name = "dailydigest"
version = "0.1.0"
description = "Personalized local research and news digest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "fastembed>=0.3.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "jinja2>=3.1.4",
    "resend>=2.0.0",
    "typer>=0.12.3",
    "pyyaml>=6.0.1",
    "langdetect>=1.0.9",
    "tzlocal>=5.2",
    "tenacity>=8.3.0",
    "python-dateutil>=2.9.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
# Arbitrary HuggingFace encoders (SPECTER2, MedCPT, bge-large, E5, ...) via
# sentence-transformers. Pulls in PyTorch (~2 GB+ with CUDA libs), so it is NOT
# installed by default — the fastembed/ONNX backend covers the default bge-small
# with no torch. Install with:  uv sync --extra hf
hf = ["sentence-transformers>=3.0.0"]

[project.scripts]
dd = "dailydigest.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dailydigest"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "dailydigest/templates"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
