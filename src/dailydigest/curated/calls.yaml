# Hand-kept list read by dailydigest.ingest.curated. Facts come from official
# pages (checked on each entry's verified_on date). Refresh deadlines and
# meeting dates monthly; see the README section on curated lists.
# DailyDigest curated list: recurring fellowships and awards (individual applicants)
# Compiled 2026-10-28 from each funder's own page.
#
# Field conventions beyond the brief:
#   url_status   HTTP status seen with curl (browser UA) on 2026-10-28. Strings mark non-HTTP
#                outcomes: "timeout" (no response in 30 s), "tls_error" (server sends an
#                incomplete certificate chain). Non-200 entries rely on an official-domain
#                search snippet; this is stated in deadline_evidence or the comment above the entry.
#   next_deadline is set only when the official page names the upcoming round's date with a year.
#                Recurring dates printed without a year (e.g. "1 April") are kept in a comment only.
#   deadline_evidence starting with "search_snippet:" means the organiser page blocks automated
#                access and the date comes from web-search results restricted to that organiser's
#                own domain (paraphrased by the search tool, not a verbatim page quote).
# MSCA Postdoctoral Fellowships and ERC Starting Grants are deliberately excluded: they arrive
# through the EU Funding & Tenders API source.

