# Hand-kept list read by dailydigest.ingest.curated. Facts come from official
# pages (checked on each entry's verified_on date). Refresh deadlines and
# meeting dates monthly; see the README section on curated lists.
# DailyDigest curated list: flagship meetings whose organisers block automated access
# Compiled 2026-10-28. Only events starting on or after 2026-11-05.
# Rechecked 2026-10-28: grc.org answers non-browser clients (including its MeetingSearch.ashx
# endpoint) with a reCAPTCHA page, and mrs.org, rsc.org and cell.com with Cloudflare challenges
# (acs.org with an Incapsula page), so none of these is read automatically; keep them here.
# ECI, Biophysical Society and FASEB meetings come from their own adapters, not this list.
#
# evidence_kind:
#   page            read from the organiser's own data (for GRC: the JSON search endpoint behind
#                   grc.org/conferences.aspx, fetched once, ResultCount 399 for 2027).
#   search_snippet  organiser page blocks automated clients; dates come from web-search results
#                   restricted to the organiser's own domain (paraphrased by the search tool).
# format: GRC, MRS, ACS, Faraday Discussions, AIChE and Cell Press symposia are listed as in_person;
#   none of the sources read here state a virtual option, but this was not checked page by page.
# deadline: set only where an upcoming (not past) abstract/application date was stated. GRC
#   application deadlines live on each conference page and were not fetched.

