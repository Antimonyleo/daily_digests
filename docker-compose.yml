# DailyDigest via Docker — the zero-Python-setup path.
#
#   docker compose up --build      # first run (builds the image)
#   docker compose up -d           # later runs (background)
#
# Then open http://127.0.0.1:8765 in your browser.
#
# Works anywhere Docker Desktop runs: macOS, Linux, and Windows (WSL2 backend).
services:
  dailydigest:
    build: .
    # Loopback-only on the host, matching the app's local-first security stance.
    ports:
      - "127.0.0.1:8765:8765"
    # Persist DB, profile, and learned models across rebuilds.
    volumes:
      - ./data:/app/data
    environment:
      # Opt into the container's non-loopback (0.0.0.0) bind. Safe only because
      # the port above is mapped to 127.0.0.1 on the host; the app has no auth.
      DD_ALLOW_REMOTE_BIND: "1"
      # Compose reads these optional values from the host's .env file. Extractive
      # summaries remain the zero-configuration default.
      LLM_BACKEND: "${LLM_BACKEND:-extractive}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      # Local timezone so the 8am gate fires at your morning (e.g. America/New_York).
      USER_TZ: "${USER_TZ:-UTC}"
    restart: unless-stopped
